name: Validate and publish application

on:
  pull_request:
  push:
    branches: [ecv2-helm]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    concurrency:
      group: publish-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: azure/setup-helm@v5.0.1
        with:
          version: v3.17.2
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Install Replicated CLI
        env:
          REPLICATED_CLI_VERSION: '0.129.15'
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/replicatedhq/replicated/releases/download/v${REPLICATED_CLI_VERSION}/replicated_${REPLICATED_CLI_VERSION}_linux_amd64.tar.gz" \
            -o "$RUNNER_TEMP/replicated.tar.gz"
          mkdir -p "$RUNNER_TEMP/replicated-cli"
          tar -xzf "$RUNNER_TEMP/replicated.tar.gz" -C "$RUNNER_TEMP/replicated-cli" replicated
          echo "$RUNNER_TEMP/replicated-cli" >> "$GITHUB_PATH"
      - name: Generate and lint
        run: make lint
      - name: Determine next release version
        id: next-version
        if: github.event_name == 'push' && github.ref == 'refs/heads/ecv2-helm'
        uses: ./.github/actions/next-release-version
        with:
          channel: ecv2-helm
          app: ${{ secrets.REPLICATED_APP }}
        env:
          REPLICATED_API_TOKEN: ${{ secrets.REPLICATED_API_TOKEN }}
      - name: Create Replicated release
        if: github.event_name == 'push' && github.ref == 'refs/heads/ecv2-helm'
        env:
          REPLICATED_API_TOKEN: ${{ secrets.REPLICATED_API_TOKEN }}
          REPLICATED_APP: ${{ secrets.REPLICATED_APP }}
          RELEASE_VERSION: ${{ steps.next-version.outputs.version }}
        run: replicated release create --yaml-dir manifests --promote ecv2-helm --version "$RELEASE_VERSION"
