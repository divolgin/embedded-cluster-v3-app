message: "Hello from Alpine!"
intervalSeconds: "10"
image: docker.io/library/postgres:17.11-alpine3.23

# Manual Config screen fixtures; these are not consumed by the pod.
configTest:
  public:
    environment: development
    log_level: info
    enable_notifications: '0'
    notification_email: ''
    banner_message: Welcome to the config test app.
    extra_settings: |-
      feature_alpha=false
      feature_beta=true
      region=us-west-2
    enable_advanced: '0'
    username: test-user
    certificate_filename: ''
    private_key_filename: ''
    endpoint: https://example.com/api
    advanced_notes: ''
    readonly_summary: ''
  secret:
    password: ''
    api_token: ''
    certificate: ''
    private_key: ''

postgres:
  image: docker.io/library/postgres:17.11-alpine3.23
  # EC replaces this standalone Helm test password with a generated config value.
  password: alpine-test-password
  # PostgreSQL needs space for its system catalogs and WAL, even with a tiny table.
  storage: 128Mi
  backupStorage: 16Mi

# Packaged defaults read by the Replicated HelmValue function.
compatibilityDefaults:
  marker: packaged-release-b
templateFunctions:
  public: {}
  secret: {}
