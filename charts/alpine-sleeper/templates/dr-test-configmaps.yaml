apiVersion: v1
kind: ConfigMap
metadata:
  annotations:
    kots.io/keep: "true"
  name: alpine-dr-restore-test
  labels:
    dr-test: restore
data:
  state: before-restore
  message: {{ .Values.message | toString | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  annotations:
    kots.io/keep: "true"
  name: alpine-dr-excluded
  labels:
    dr-test: exclude
data:
  state: should-not-be-backed-up
