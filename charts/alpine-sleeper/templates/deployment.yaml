apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kots.io/keep: "true"
  name: alpine-sleeper
  labels:
{{- with $.Values.commonLabels }}
{{ toYaml . | indent 4 }}
{{- end }}
    app.kubernetes.io/name: alpine-sleeper
    app.kubernetes.io/instance: alpine-sleeper
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: alpine-sleeper
      app.kubernetes.io/instance: alpine-sleeper
  template:
    metadata:
      labels:
{{- with $.Values.commonLabels }}
{{ toYaml . | indent 8 }}
{{- end }}
        app.kubernetes.io/name: alpine-sleeper
        app.kubernetes.io/instance: alpine-sleeper
    spec:
{{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
{{ toYaml . | indent 8 }}
{{- end }}
      containers:
        - name: alpine
          image: {{ .Values.image | quote }}
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          args:
            - |
              until psql -X --set=ON_ERROR_STOP=1 -c 'SELECT 1 FROM timestamps LIMIT 0;'; do
                echo 'Waiting for PostgreSQL and the timestamps table...'
                sleep 2
              done
              while true; do
                printf '%s\n' "$MESSAGE"
                if ! psql -X --set=ON_ERROR_STOP=1 \
                  -c 'INSERT INTO timestamps DEFAULT VALUES RETURNING id, recorded_at;'; then
                  echo 'Timestamp insert failed; retrying next iteration.' >&2
                fi
                sleep "$INTERVAL_SECONDS"
              done
          env:
            - name: MESSAGE
              value: {{ .Values.message | toString | quote }}
            - name: INTERVAL_SECONDS
              value: {{ .Values.intervalSeconds | toString | quote }}
            - name: PGHOST
              value: alpine-postgres
            - name: PGDATABASE
              value: alpine
            - name: PGUSER
              value: alpine
            - name: PGCONNECT_TIMEOUT
              value: "5"
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: alpine-postgres
                  key: password
          resources:
            requests:
              cpu: 1m
              memory: 8Mi
            limits:
              cpu: 100m
              memory: 32Mi
