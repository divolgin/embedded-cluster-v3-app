{{- $gpuEnabled := eq (toString .Values.gpu.enabled) "true" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alpine-sleeper
  labels:
    app.kubernetes.io/name: alpine-sleeper
    app.kubernetes.io/instance: alpine-sleeper
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: alpine-sleeper
      app.kubernetes.io/instance: alpine-sleeper
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alpine-sleeper
        app.kubernetes.io/instance: alpine-sleeper
    spec:
      {{- if and $gpuEnabled .Values.gpu.runtimeClassName }}
      runtimeClassName: {{ .Values.gpu.runtimeClassName | quote }}
      {{- end }}
      containers:
        - name: alpine
          image: {{ ternary .Values.gpu.image .Values.image $gpuEnabled | quote }}
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          args:
            - |
              {{- if $gpuEnabled }}
              nvidia-smi -L
              nvidia-smi
              echo 'GPU_SMOKE_TEST_PASSED'
              {{- end }}
              until psql -X --set=ON_ERROR_STOP=1 -c 'SELECT 1 FROM timestamps LIMIT 0;'; do
                echo 'Waiting for PostgreSQL and the timestamps table...'
                sleep 2
              done
              while true; do
                printf '%s\n' "$MESSAGE"
                if ! psql -X --set=ON_ERROR_STOP=1 \
                  -c 'INSERT INTO timestamps DEFAULT VALUES RETURNING id, recorded_at;'; then
                  echo 'Timestamp insert failed; retrying next iteration.' >&2
                fi
                sleep "$INTERVAL_SECONDS"
              done
          env:
            {{- if $gpuEnabled }}
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: compute,utility
            {{- end }}
            - name: MESSAGE
              value: {{ .Values.message | toString | quote }}
            - name: INTERVAL_SECONDS
              value: {{ .Values.intervalSeconds | toString | quote }}
            - name: PGHOST
              value: alpine-postgres
            - name: PGDATABASE
              value: alpine
            - name: PGUSER
              value: alpine
            - name: PGCONNECT_TIMEOUT
              value: "5"
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: alpine-postgres
                  key: password
          {{- if $gpuEnabled }}
          readinessProbe:
            exec:
              command: ["nvidia-smi", "-L"]
            timeoutSeconds: 10
            periodSeconds: 30
          {{- end }}
          resources:
            requests:
              cpu: 1m
              memory: 8Mi
              {{- if $gpuEnabled }}
              nvidia.com/gpu: 1
              {{- end }}
            limits:
              cpu: 100m
              memory: {{ ternary "128Mi" "32Mi" $gpuEnabled }}
              {{- if $gpuEnabled }}
              nvidia.com/gpu: 1
              {{- end }}
