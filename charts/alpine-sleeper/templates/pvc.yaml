{{- range $name, $size := dict "data" .Values.postgres.storage "backup" .Values.postgres.backupStorage }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  annotations:
    kots.io/keep: "true"
  name: alpine-postgres-{{ $name }}
  labels:
    app.kubernetes.io/name: alpine-postgres
    app.kubernetes.io/instance: alpine-sleeper
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ $size | quote }}
{{- end }}
