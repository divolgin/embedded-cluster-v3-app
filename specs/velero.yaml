apiVersion: kots.io/v1beta1
kind: HelmChart
metadata:
  name: velero
spec:
  exclude: '{{repl ne KotsVersion "" }}'
  chart:
    name: velero
    chartVersion: 12.1.0
    releaseName: velero
  helmVersion: v3
  useHelmInstall: false
  namespace: velero
  weight: -100
  values:
    initContainers:
    - name: velero-plugin-for-aws
      image: docker.io/velero/velero-plugin-for-aws:v1.14.2
    configMaps:
      pr591-modifiers:
        data:
          resource-modifiers.yaml: |
            version: v1
            resourceModifierRules:
            - conditions:
                groupResource: configmaps
                resourceNameRegex: ^alpine-dr-restore-test$
                labelSelector:
                  matchLabels:
                    dr-test: restore
              patches:
              - operation: replace
                path: /data/state
                value: restored-by-pr591
            - conditions:
                groupResource: configmaps
                resourceNameRegex: ^alpine-postgres-config$
                labelSelector:
                  matchLabels:
                    dr-test: postgres
              patches:
              - operation: replace
                path: /data/restore-marker
                value: restored-by-pr591
  builder:
    initContainers:
    - name: velero-plugin-for-aws
      image: docker.io/velero/velero-plugin-for-aws:v1.14.2
