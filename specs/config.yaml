apiVersion: kots.io/v1beta1
kind: Config
metadata:
  name: alpine-config
spec:
  groups:
    - name: output
      title: Pod output
      items:
        - name: message
          title: Message
          type: text
          default: Hello from Alpine!
          required: true
        - name: interval_seconds
          title: Interval (seconds)
          type: text
          default: "10"
          required: true
          validation:
            regex:
              pattern: '^[1-9][0-9]*$'
              message: Enter a positive whole number of seconds.
    - name: display
      title: Display and behavior
      description: Exercise checkboxes, dropdowns, radio buttons, and multiline diffs.
      items:
        - name: environment
          title: Environment
          type: dropdown
          default: development
          items:
            - name: development
              title: Development
            - name: staging
              title: Staging
            - name: production
              title: Production
        - name: log_level
          title: Log level
          type: select_one
          default: info
          items:
            - name: debug
              title: Debug
            - name: info
              title: Info
            - name: warn
              title: Warning
        - name: enable_notifications
          title: Enable notifications
          type: bool
          default: "0"
        - name: notification_email
          title: Notification email
          type: text
          when: '{{repl ConfigOptionEquals "enable_notifications" "1" }}'
          required: true
          validation:
            regex:
              pattern: '^[^\s@]+@[^\s@]+\.[^\s@]+$'
              message: Enter an email address.
        - name: banner_message
          title: Message
          type: text
          default: Welcome to the config test app.
          help_text: This label also appears in Pod output; compare item IDs in the diff.
        - name: extra_settings
          title: Extra settings
          type: textarea
          default: |-
            feature_alpha=false
            feature_beta=true
            region=us-west-2
          help_text: Change one line, add a line, and remove a line to exercise multiline diffs.
        - name: enable_advanced
          title: Show advanced settings
          type: bool
          default: "0"
    - name: credentials
      title: Credentials
      description: Test password masking and persistent value initializers. Use dummy credentials.
      items:
        - name: username
          title: Username
          type: text
          default: test-user
          required: true
        - name: password
          title: Password
          type: password
          value: '{{repl RandomString 32 }}'
          required: true
          help_text: Generated once. Save unrelated changes and redeploy to check that it stays the same.
        - name: api_token
          title: API token
          type: password
          help_text: Optional dummy token; test setting, changing, and clearing it.
    - name: files
      title: File uploads
      description: Upload dummy files, then replace one with the same filename and different contents.
      items:
        - name: certificate
          title: Certificate
          type: file
          help_text: Optional dummy certificate. The diff should mask its contents.
        - name: private_key
          title: Private key
          type: file
          help_text: Optional dummy key. Stored in a Secret together with the certificate.
    - name: advanced
      title: Advanced settings
      when: '{{repl ConfigOptionEquals "enable_advanced" "1" }}'
      description: This entire group is conditional on Show advanced settings in Display and behavior.
      items:
        - name: endpoint
          title: Endpoint
          type: text
          default: https://example.com/api
          required: true
        - name: advanced_notes
          title: Extra settings
          type: textarea
          help_text: Try long lines, quotes, colons, and blank lines; this label also appears in another group.
        - name: readonly_summary
          title: Current environment
          type: text
          readonly: true
          value: '{{repl ConfigOption "environment" }}'
    - name: database
      title: PostgreSQL
      description: Credentials for the timestamp database and its Alpine writer.
      items:
        - name: database_password
          title: Database password
          type: password
          value: '{{repl RandomString 32 }}'
          required: true
          readonly: false
          help_text: Initialized once and retained through redeploys and disaster recovery.

    - name: release_defaults
      title: PR 619 release B fixtures
      description: Use dummy values. Compare config-test resources across previews, restarts,
        upgrades and restore.
      items:
      - name: follow_default
        title: Untouched ordinary default
        type: text
        default: release-b
        help_text: Untouched values now resolve to release-b.
      - name: override_default
        title: Explicit different override
        type: text
        default: release-b
        help_text: Enter customer-choice in release A; it must survive release B.
      - name: equal_default
        title: Explicit override equal to default
        type: text
        default: release-b
        help_text: Type release-a explicitly; it must remain release-a in release B.
      - name: clear_override
        title: Clearable override
        type: text
        default: release-b
        help_text: Enter customer-choice, save, then clear; the release default must return.
      - name: required_default
        title: Required ordinary default
        type: text
        default: required-b
        required: true
      - name: dependency_input
        title: Dependency input
        type: text
        default: input-b
      - name: dependent_default
        title: Dependent ordinary default
        type: text
        default: '{{repl printf "%s-derived-b" (ConfigOption "dependency_input") }}'
        help_text: Change Dependency input and verify this follows it unless explicitly
          overridden.
      - name: zero_override
        title: Explicit zero
        type: text
        default: '9'
        help_text: Enter 0; it must remain an explicit override across upgrades.
      - name: native_true
        title: Native true default
        type: bool
        default: true
        help_text: Uncheck and save; the explicit 0 must survive redraws and upgrades.
      - name: native_false
        title: Native false default
        type: bool
        default: true
      - name: static_initializer
        title: Static value initializer
        type: text
        value: initialized-b
        default: fallback-b
        help_text: Must stay initialized-a after upgrade. Clearing uses fallback, never
          reruns value.
      - name: clearable_initializer
        title: Clearable value initializer
        type: text
        value: '{{repl RandomString 24 }}'
        default: cleared-b
        help_text: Dummy value. Clear and save; expect cleared-b, never a newly generated
          initializer.
      - name: random_default
        title: Recomputed random default
        type: text
        default: '{{repl RandomString 24 }}'
        help_text: Dummy value; expected to change between rendering operations, unlike
          value initializers.
      - name: password_copy
        title: Generated password dependency
        type: password
        default: '{{repl ConfigOption "password" }}'
        help_text: Must equal Password in the Secret; leave untouched.
      - name: hidden_default
        title: Hidden ordinary default
        type: text
        default: hidden-b
        hidden: true
      - name: conditional_default
        title: Conditional ordinary default
        type: text
        default: conditional-b
        when: '{{repl ConfigOptionEquals "enable_advanced" "1" }}'
      - name: readonly_default
        title: Readonly ordinary default
        type: text
        default: readonly-b
        readonly: true
      - name: readonly_value
        title: Readonly value expression
        type: text
        value: '{{repl printf "%s-readonly-b" (ConfigOption "dependency_input") }}'
        readonly: true
      - name: broken_default
        title: Optional failed default
        type: text
        default: '{{repl MissingDefaultFunction }}'
        help_text: Intentionally logs a default-template error; resolves empty. Enter
          an override to verify it remains usable.
      - name: multiline_default
        title: Multiline ordinary default
        type: textarea
        default: |-
          release=b
          feature=true
      - name: editable_to_readonly
        title: Editable to readonly in release B
        type: text
        default: editable-b
        readonly: true
        help_text: Now readonly; the release A customer override must be ignored.
      - name: readonly_to_editable
        title: Readonly to editable in release B
        type: text
        value: readonly-initializer-b
        readonly: false
      - name: empty_initializer
        title: Clear initializer without fallback
        type: text
        value: '{{repl RandomString 24 }}'
        help_text: Clear and save; must stay empty across previews and upgrades.
      - name: hidden_initializer
        title: Hidden initializer
        type: text
        value: '{{repl randAlphaNum 24 }}'
        hidden: true
