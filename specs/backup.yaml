# Vendor policy template consumed by EC PR #591; not applied as a live Backup.
apiVersion: velero.io/v1
kind: Backup
metadata:
  name: alpine-sleeper
spec:
  includedNamespaces:
    - 'repl{{ Namespace }}'
  orLabelSelectors:
    - matchExpressions:
        - key: dr-test
          operator: NotIn
          values: [exclude]
    - matchLabels:
        embeddedcluster.replicated.com/recovery: "true"
  defaultVolumesToFsBackup: true
  snapshotVolumes: false
  # pg_dump completes before Velero copies the dump volume. Failure aborts backup.
  hooks:
    resources:
      - name: postgres-dump
        includedResources:
          - pods
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: alpine-postgres
        pre:
          - exec:
              container: postgres
              command:
                - /bin/sh
                - -ec
                - >-
                  pg_dump --host=127.0.0.1 --username="$POSTGRES_USER"
                  --dbname="$POSTGRES_DB" --format=custom --no-owner --no-privileges
                  --file=/backups/database.dump.tmp &&
                  mv /backups/database.dump.tmp /backups/database.dump
              onError: Fail
              timeout: 2m
