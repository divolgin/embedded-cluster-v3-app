apiVersion: kots.io/v1beta1
kind: Application
metadata:
  name: alpine-ec-v3
spec:
  title: Alpine Embedded Cluster v3
  statusInformers:
  - deployment/replicated
  - deployment/alpine-sleeper
  - deployment/alpine-postgres
  releaseNotes: 'Disaster recovery via native Velero backups and S3-compatible storage
    (EC PR #577).

    Packages Velero 1.18.2 and AWS plugin 1.14.2 using chart 12.1.0.

    Preserves configurable Alpine output, SDK 1.19.11, and worker-node support.

    Writes one timestamp row per iteration to PostgreSQL, with 128 MiB database storage and a 16 MiB logical backup volume.

    Adds EC v3 air gap image rewriting for the PostgreSQL Alpine writer, database, SDK, Velero, and the AWS plugin.

    Exercises PR #591 vendor Backup/Restore policies, backup filtering, and restore resource modifiers, including a PostgreSQL marker recorded in restore_events.

    Requires an EC build containing PR #591. Prototype DR backups are not compatible.

    '
