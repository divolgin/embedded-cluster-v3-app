apiVersion: kots.io/v1beta2
kind: HelmChart
metadata:
  name: redis
spec:
  chart:
    name: redis
    chartVersion: 0.1.0
  releaseName: redis
  exclude: '{{repl ConfigOptionEquals "enable_redis" "0" }}'
  values:
    image: docker.io/library/redis:7.4.8-alpine
    imagePullSecrets:
      - name: '{{repl ImagePullSecretName }}'
  builder:
    image: docker.io/library/redis:7.4.8-alpine
