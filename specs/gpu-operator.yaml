apiVersion: kots.io/v1beta2
kind: HelmChart
metadata:
  name: gpu-operator
spec:
  chart:
    name: gpu-operator
    chartVersion: v26.3.3
  releaseName: gpu-operator
  namespace: gpu-operator
  weight: -50
  exclude: '{{repl ConfigOptionEquals "enable_gpu" "0" }}'
  helmUpgradeFlags:
    - --wait
    - --timeout
    - 20m
  values:
    driver:
      enabled: '{{repl ConfigOptionEquals "gpu_install_driver" "1" }}'
    # Unsupported by GPU Operator v26.3.3.
    # hostPaths:
    #   kubeletRootDir: /var/lib/embedded-cluster/k0s/kubelet
    toolkit:
      env:
        - name: CONTAINERD_CONFIG
          value: /etc/k0s/containerd.d/nvidia.toml
        - name: CONTAINERD_SOCKET
          value: /run/k0s/containerd.sock
        - name: RUNTIME_CONFIG_SOURCE
          value: file
        - name: CONTAINERD_SET_AS_DEFAULT
          value: "false"
    # EC installs the packaged CRDs; avoid the chart's separate CRD upgrade hook.
    operator:
      upgradeCRD: false
  builder:
    driver:
      enabled: true
    # Unsupported by GPU Operator v26.3.3.
    # hostPaths:
    #   kubeletRootDir: /var/lib/embedded-cluster/k0s/kubelet
    operator:
      upgradeCRD: false
